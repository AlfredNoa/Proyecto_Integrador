<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGIMAC — Insumos</title>
    <style>
        body { font-family:"Segoe UI",Arial,sans-serif; background:#f4f7fb; margin:0; padding:32px; color:#1f2937; }
        .card { max-width:900px; margin:0 auto; background:#fff; border:1px solid #dde5f0; border-radius:12px; padding:24px; }
        table { width:100%; border-collapse:collapse; margin-top:12px; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid #dde5f0; font-size:14px; }
        th { font-size:12px; color:#6b7280; text-transform:uppercase; }
        input { padding:8px 10px; border:1px solid #dde5f0; border-radius:8px; font:inherit; }
        .btn { display:inline-block; background:#185fa5; color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
        .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
    </style>
</head>
<body>
<div class="card">
    <div class="top">
        <h1>Insumos</h1>
        <a class="btn" th:href="@{/insumos/nuevo}">Nuevo insumo</a>
    </div>
    <form th:action="@{/insumos}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre o código" style="width:280px">
        <button type="submit">Buscar</button>
    </form>
    <table>
        <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Stock mínimo</th></tr>
        <tr th:each="i : ${insumos}">
            <td th:text="${i.codigo}"></td>
            <td th:text="${i.nombre}"></td>
            <td th:text="${i.nombreCategoria}"></td>
            <td th:text="${i.unidadMedida}"></td>
            <td th:text="${i.stockMinimo}"></td>
        </tr>
    </table>
</div>
</body>
</html>
