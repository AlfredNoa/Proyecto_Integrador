<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGIMAC — Categorías</title>
    <style>
        body { font-family:"Segoe UI",Arial,sans-serif; background:#f4f7fb; margin:0; padding:32px; color:#1f2937; }
        .card { max-width:760px; margin:0 auto; background:#fff; border:1px solid #dde5f0; border-radius:12px; padding:24px; }
        table { width:100%; border-collapse:collapse; margin-top:12px; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid #dde5f0; font-size:14px; }
        th { font-size:12px; color:#6b7280; text-transform:uppercase; }
        input { padding:8px 10px; border:1px solid #dde5f0; border-radius:8px; font:inherit; }
        button { background:#185fa5; color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
        button.link { background:none; color:#b42318; padding:0; font-weight:400; }
        .error { background:#fee4e2; color:#b42318; padding:10px 12px; border-radius:8px; font-size:13px; margin-top:12px; }
        form.alta { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
        form.alta input { flex:1; min-width:160px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Categorías</h1>
    <div class="error" th:if="${error}" th:text="${error}"></div>
    <table>
        <tr><th>Nombre</th><th>Descripción</th><th></th></tr>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.descripcion}"></td>
            <td>
                <form th:action="@{/categorias/{id}/eliminar(id=${c.idCategoria})}" method="post" style="display:inline">
                    <button class="link" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
    </table>
    <form class="alta" th:action="@{/categorias/nuevo}" method="post">
        <input type="text" name="nombre" placeholder="Nombre de la categoría" required>
        <input type="text" name="descripcion" placeholder="Descripción">
        <button type="submit">Agregar</button>
    </form>
</div>
</body>
</html>
