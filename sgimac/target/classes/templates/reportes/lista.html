<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGIMAC — Reportes</title>
    <style>
        body { font-family:"Segoe UI",Arial,sans-serif; background:#f4f7fb; margin:0; padding:32px; color:#1f2937; }
        .card { max-width:900px; margin:0 auto 16px; background:#fff; border:1px solid #dde5f0; border-radius:12px; padding:24px; }
        table { width:100%; border-collapse:collapse; margin-top:12px; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid #dde5f0; font-size:14px; }
        th { font-size:12px; color:#6b7280; text-transform:uppercase; }
        .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
        .tab { display:inline-block; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:14px; }
        .tab.on { background:#185fa5; color:#fff; } .tab.off { background:#e6f1fb; color:#185fa5; }
        select, button { padding:8px 12px; border-radius:8px; border:1px solid #dde5f0; font:inherit; }
        button { background:#185fa5; color:#fff; border:0; font-weight:600; cursor:pointer; }
        .ok { background:#dcfae6; color:#067647; padding:10px 12px; border-radius:8px; font-size:14px; margin-top:12px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reportes</h1>
    <div class="tabs">
        <a class="tab" th:classappend="${tipo == 'inventario'} ? 'on' : 'off'" th:href="@{/reportes(tipo='inventario')}">Inventario por lote</a>
        <a class="tab" th:classappend="${tipo == 'proximos'} ? 'on' : 'off'" th:href="@{/reportes(tipo='proximos')}">Próximos a vencer</a>
        <a class="tab" th:classappend="${tipo == 'movimientos'} ? 'on' : 'off'" th:href="@{/reportes(tipo='movimientos')}">Movimientos</a>
    </div>

    <form th:action="@{/reportes/generar}" method="post" style="margin-top:14px; display:flex; gap:8px; align-items:center;">
        <input type="hidden" name="tipo" th:value="${tipo}">
        <select name="formato">
            <option value="PDF">PDF</option>
            <option value="EXCEL">Excel</option>
        </select>
        <button type="submit">Generar reporte</button>
    </form>
    <div class="ok" th:if="${mensaje}" th:text="${mensaje}"></div>

    <table th:if="${tipo == 'inventario'}">
        <tr><th>Insumo</th><th>Lote</th><th>Vencimiento</th><th>Stock</th><th>Ubicación</th></tr>
        <tr th:each="l : ${lotes}">
            <td th:text="${l.nombreInsumo}"></td><td th:text="${l.codigoQr}"></td>
            <td th:text="${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')}"></td>
            <td th:text="${l.cantidadActual} + ' ' + ${l.unidadMedida}"></td>
            <td th:text="${l.nombreUbicacion}"></td>
        </tr>
    </table>

    <table th:if="${tipo == 'proximos'}">
        <tr><th>Insumo</th><th>Lote</th><th>Vencimiento</th><th>Stock</th></tr>
        <tr th:each="l : ${proximosAVencer}">
            <td th:text="${l.nombreInsumo}"></td><td th:text="${l.codigoQr}"></td>
            <td th:text="${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')}"></td>
            <td th:text="${l.cantidadActual} + ' ' + ${l.unidadMedida}"></td>
        </tr>
    </table>

    <table th:if="${tipo == 'movimientos'}">
        <tr><th>Fecha</th><th>Tipo</th><th>Insumo</th><th>Lote</th><th>Cantidad</th><th>Usuario</th></tr>
        <tr th:each="m : ${movimientos}">
            <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${m.tipo}"></td><td th:text="${m.nombreInsumo}"></td>
            <td th:text="${m.codigoQrLote}"></td><td th:text="${m.cantidad}"></td>
            <td th:text="${m.nombreUsuario}"></td>
        </tr>
    </table>
</div>

<div class="card">
    <h1>Reportes generados</h1>
    <table>
        <tr><th>Fecha</th><th>Tipo</th><th>Formato</th><th>Generado por</th></tr>
        <tr th:each="r : ${historial}">
            <td th:text="${#temporals.format(r.fechaGeneracion, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${r.tipo}"></td><td th:text="${r.formato}"></td>
            <td th:text="${r.nombreUsuario}"></td>
        </tr>
    </table>
</div>
</body>
</html>
