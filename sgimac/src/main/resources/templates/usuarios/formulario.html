<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo usuario')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('usuarios')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Nuevo usuario')}"></div>
<div class="card form">
    <h2>Datos del usuario</h2>
    <form th:action="@{/usuarios/nuevo}" method="post">
        <div class="grid">
            <div class="full">
                <label>Nombres</label>
                <input type="text" name="nombres" required>
            </div>
            <div>
                <label>Correo</label>
                <input type="email" name="correo" required>
            </div>
            <div>
                <label>Contraseña</label>
                <input type="password" name="contrasena" required>
            </div>
            <div class="full">
                <label>Rol</label>
                <select name="idRol" required>
                    <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}"></option>
                </select>
            </div>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn g" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</div>
</main>
</div>
</body>
</html>
