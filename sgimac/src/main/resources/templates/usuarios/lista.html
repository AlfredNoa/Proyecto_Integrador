<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('usuarios')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Usuarios')}"></div>
<div class="card toolbar">
    <span class="who">Cuentas con acceso al sistema</span>
    <a class="btn" th:href="@{/usuarios/nuevo}">+ Nuevo usuario</a>
</div>
<div class="card">
    <h2>Listado de usuarios</h2>
    <div class="wrap">
        <table>
            <tr><th>Nombres</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombres}"></td>
                <td th:text="${u.correo}"></td>
                <td th:text="${u.nombreRol}"></td>
                <td><span class="b" th:classappend="${u.activo} ? 'grn' : 'red'" th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span></td>
                <td>
                    <form class="inline" th:action="@{/usuarios/{id}/estado(id=${u.idUsuario})}" method="post">
                        <input type="hidden" name="activo" th:value="${!u.activo}">
                        <button class="btn s" type="submit" th:text="${u.activo} ? 'Desactivar' : 'Activar'"></button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
