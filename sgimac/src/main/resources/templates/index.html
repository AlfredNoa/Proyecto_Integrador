<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<div class="centro">
    <div class="login" style="max-width:560px">
        <div class="card">
            <h1>SGIMAC</h1>
            <p class="lead">Sistema de Gestión de Insumos Médicos y Alertas de Caducidad</p>

            <div class="msg ok" th:if="${conectado}">Conexión a la base de datos establecida.</div>
            <div class="msg err" th:unless="${conectado}">
                No se pudo conectar a la base de datos.
                <div th:text="${error}"></div>
            </div>

            <div class="wrap" th:if="${conectado}" style="margin-top:14px">
                <table>
                    <tr><th>ID</th><th>Rol</th><th>Descripción</th></tr>
                    <tr th:each="r : ${roles}">
                        <td th:text="${r.idRol}"></td>
                        <td th:text="${r.nombre}"></td>
                        <td th:text="${r.descripcion}"></td>
                    </tr>
                </table>
            </div>
            <a class="btn" th:href="@{/login}" style="margin-top:16px;text-align:center;display:block">Ir a iniciar sesión</a>
        </div>
    </div>
</div>
</body>
</html>
