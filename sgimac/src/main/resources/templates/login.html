<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div class="centro">
    <div class="login">
        <div class="card">
            <h1>SGIMAC</h1>
            <p class="lead">Sistema de Gestión de Insumos Médicos<br>y Alertas de Caducidad<br>Hospital José Agurto Tello</p>
            <form th:action="@{/login}" method="post">
                <label>Correo</label>
                <input type="email" name="correo" placeholder="usuario@sgimac.pe" required>
                <label>Contraseña</label>
                <input type="password" name="contrasena" required>
                <button class="btn" type="submit">Ingresar</button>
            </form>
            <div class="msg err" th:if="${error}" th:text="${error}"></div>
        </div>
    </div>
</div>
</body>
</html>
