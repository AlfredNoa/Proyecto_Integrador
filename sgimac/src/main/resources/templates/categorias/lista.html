<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('categorias')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Categorías')}"></div>
<div class="card">
    <h2>Agregar categoría</h2>
    <form th:action="@{/categorias/nuevo}" method="post">
        <div class="grid">
            <div><label>Nombre</label><input type="text" name="nombre" placeholder="Nombre de la categoría" required></div>
            <div><label>Descripción</label><input type="text" name="descripcion" placeholder="Descripción"></div>
            <div><button class="btn" type="submit">Agregar</button></div>
        </div>
    </form>
    <div class="msg err" th:if="${error}" th:text="${error}"></div>
</div>
<div class="card">
    <h2>Listado de categorías</h2>
    <div class="vacio" th:if="${#lists.isEmpty(categorias)}">No hay categorías registradas.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(categorias)}">
        <table>
            <tr><th>Nombre</th><th>Descripción</th><th></th></tr>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.descripcion}"></td>
                <td>
                    <form class="inline" th:action="@{/categorias/{id}/eliminar(id=${c.idCategoria})}" method="post">
                        <button class="btn d" type="submit" onclick="return confirm('¿Eliminar esta categoría?')">Eliminar</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
