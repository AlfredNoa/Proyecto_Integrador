<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('reportes')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Reportes')}"></div>
<div class="card">
    <div class="tabs">
        <a class="btn" th:classappend="${tipo == 'inventario'} ? '' : 's'" th:href="@{/reportes(tipo='inventario')}">Inventario por lote</a>
        <a class="btn" th:classappend="${tipo == 'proximos'} ? '' : 's'" th:href="@{/reportes(tipo='proximos')}">Próximos a vencer</a>
        <a class="btn" th:classappend="${tipo == 'movimientos'} ? '' : 's'" th:href="@{/reportes(tipo='movimientos')}">Movimientos</a>
    </div>

    <form th:action="@{/reportes/generar}" method="post" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <input type="hidden" name="tipo" th:value="${tipo}">
        <select name="formato" style="width:auto">
            <option value="PDF">PDF</option>
            <option value="EXCEL">Excel</option>
        </select>
        <button class="btn" type="submit">Generar reporte</button>
    </form>
    <div class="msg ok" th:if="${mensaje}" th:text="${mensaje}"></div>

    <div class="wrap" th:if="${tipo == 'inventario'}" style="margin-top:14px">
        <table>
            <tr><th>Insumo</th><th>Lote</th><th>Vencimiento</th><th>Stock</th><th>Ubicación</th></tr>
            <tr th:each="l : ${lotes}">
                <td th:text="${l.nombreInsumo}"></td><td th:text="${l.codigoQr}"></td>
                <td th:text="${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                <td th:text="${l.cantidadActual} + ' ' + ${l.unidadMedida}"></td>
                <td th:text="${l.nombreUbicacion}"></td>
            </tr>
        </table>
    </div>

    <div class="wrap" th:if="${tipo == 'proximos'}" style="margin-top:14px">
        <table>
            <tr><th>Insumo</th><th>Lote</th><th>Vencimiento</th><th>Stock</th></tr>
            <tr th:each="l : ${proximosAVencer}">
                <td th:text="${l.nombreInsumo}"></td><td th:text="${l.codigoQr}"></td>
                <td th:text="${#temporals.format(l.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                <td th:text="${l.cantidadActual} + ' ' + ${l.unidadMedida}"></td>
            </tr>
        </table>
    </div>

    <div class="wrap" th:if="${tipo == 'movimientos'}" style="margin-top:14px">
        <table>
            <tr><th>Fecha</th><th>Tipo</th><th>Insumo</th><th>Lote</th><th>Cantidad</th><th>Usuario</th></tr>
            <tr th:each="m : ${movimientos}">
                <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td><span class="b" th:classappend="${m.tipo == 'SALIDA'} ? 'org' : 'grn'" th:text="${m.tipo}"></span></td>
                <td th:text="${m.nombreInsumo}"></td>
                <td th:text="${m.codigoQrLote}"></td><td th:text="${m.cantidad}"></td>
                <td th:text="${m.nombreUsuario}"></td>
            </tr>
        </table>
    </div>
</div>

<div class="card">
    <h2>Reportes generados</h2>
    <div class="vacio" th:if="${#lists.isEmpty(historial)}">Aún no se han generado reportes.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(historial)}">
        <table>
            <tr><th>Fecha</th><th>Tipo</th><th>Formato</th><th>Generado por</th></tr>
            <tr th:each="r : ${historial}">
                <td th:text="${#temporals.format(r.fechaGeneracion, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${r.tipo}"></td><td th:text="${r.formato}"></td>
                <td th:text="${r.nombreUsuario}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
