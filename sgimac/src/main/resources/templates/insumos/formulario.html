<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo insumo')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('insumos')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Nuevo insumo')}"></div>
<div class="card form">
    <h2>Datos del insumo</h2>
    <form th:action="@{/insumos/nuevo}" method="post">
        <div class="grid">
            <div>
                <label>Código</label>
                <input type="text" name="codigo" placeholder="Ej.: INS-006" required>
            </div>
            <div>
                <label>Nombre</label>
                <input type="text" name="nombre" required>
            </div>
            <div>
                <label>Unidad de medida</label>
                <input type="text" name="unidadMedida" placeholder="Tabletas, Frascos, Cajas..." required>
            </div>
            <div>
                <label>Stock mínimo</label>
                <input type="number" name="stockMinimo" min="0" value="0" required>
            </div>
            <div class="full">
                <label>Categoría</label>
                <select name="idCategoria" required>
                    <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option>
                </select>
            </div>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn g" th:href="@{/insumos}">Cancelar</a>
        </div>
    </form>
</div>
</main>
</div>
</body>
</html>
