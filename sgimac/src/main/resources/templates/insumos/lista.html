<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Insumos')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('insumos')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Insumos')}"></div>
<div class="card toolbar">
    <form class="search" th:action="@{/insumos}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre o código">
        <button class="btn" type="submit">Buscar</button>
    </form>
    <a class="btn" th:href="@{/insumos/nuevo}">+ Nuevo insumo</a>
</div>
<div class="card">
    <h2>Listado de insumos</h2>
    <div class="vacio" th:if="${#lists.isEmpty(insumos)}">No se encontraron insumos.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(insumos)}">
        <table>
            <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Stock mínimo</th></tr>
            <tr th:each="i : ${insumos}">
                <td th:text="${i.codigo}"></td>
                <td th:text="${i.nombre}"></td>
                <td th:text="${i.nombreCategoria}"></td>
                <td th:text="${i.unidadMedida}"></td>
                <td th:text="${i.stockMinimo}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
