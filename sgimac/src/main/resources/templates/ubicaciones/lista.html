<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ubicaciones')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('ubicaciones')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Ubicaciones')}"></div>
<div class="card">
    <h2>Agregar ubicación</h2>
    <form th:action="@{/ubicaciones/nuevo}" method="post">
        <div class="grid">
            <div><label>Nombre</label><input type="text" name="nombre" placeholder="Nombre (ej. Almacén A-1)" required></div>
            <div><label>Tipo</label><input type="text" name="tipo" placeholder="Tipo (ej. Almacén central)" required></div>
            <div><button class="btn" type="submit">Agregar</button></div>
        </div>
    </form>
</div>
<div class="card">
    <h2>Listado de ubicaciones</h2>
    <div class="vacio" th:if="${#lists.isEmpty(ubicaciones)}">No hay ubicaciones registradas.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(ubicaciones)}">
        <table>
            <tr><th>Nombre</th><th>Tipo</th></tr>
            <tr th:each="u : ${ubicaciones}">
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.tipo}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
