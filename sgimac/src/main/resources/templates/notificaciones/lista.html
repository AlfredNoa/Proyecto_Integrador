<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notificaciones')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('notificaciones')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Notificaciones')}"></div>
<div class="card">
    <h2>Mis notificaciones</h2>
    <div class="vacio" th:if="${#lists.isEmpty(notificaciones)}">No tienes notificaciones.</div>
    <div class="al" th:each="n : ${notificaciones}">
        <span>
            <span th:class="${n.leida} ? '' : 'noleida'" th:text="${n.mensaje}"></span><br>
            <span class="fecha" th:text="${#temporals.format(n.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></span>
        </span>
        <form th:if="${!n.leida}" th:action="@{/notificaciones/{id}/leida(id=${n.idNotificacion})}" method="post">
            <button class="btn s" type="submit">Marcar leída</button>
        </form>
    </div>
</div>
</main>
</div>
</body>
</html>
