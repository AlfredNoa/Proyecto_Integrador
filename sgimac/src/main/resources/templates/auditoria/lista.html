<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auditoría del sistema')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('auditoria')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Auditoría del sistema')}"></div>
<div class="card">
    <h2>Registro de actividad</h2>
    <div class="vacio" th:if="${#lists.isEmpty(logs)}">Aún no hay actividad registrada.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(logs)}">
        <table>
            <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th></tr>
            <tr th:each="l : ${logs}">
                <td th:text="${#temporals.format(l.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${l.nombreUsuario}"></td>
                <td th:text="${l.accion}"></td>
                <td th:text="${l.entidad}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
