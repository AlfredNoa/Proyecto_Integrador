<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lotes')}"></head><body><div class="app"><nav th:replace="~{fragments/layout :: sidebar('lotes')}"></nav><main class="main"><div th:replace="~{fragments/layout :: topbar('Lotes')}"></div><section class="card toolbar"><p>Consulta ubicaciones, proveedores y fechas de vencimiento.</p><a class="btn" th:href="@{/lotes/nuevo}">Nuevo lote</a></section><section class="card"><div class="actions"><a class="btn" th:href="@{/lotes/nuevo}">+ Nuevo lote</a></div><h2>Listado de lotes</h2><form class="toolbar filtros-listado" method="get" th:action="@{/lotes}"><div><label for="q">Buscar insumo o código</label><input id="q" name="q" th:value="${q}" maxlength="100" placeholder="Nombre o código"></div><div><label for="estado">Mostrar</label><select id="estado" name="estado"><option value="TODOS">Todos</option><option value="VENCIDO" th:selected="${estado == 'VENCIDO'}">Vencidos con stock</option><option value="UTILIZABLE" th:selected="${estado == 'UTILIZABLE'}">No vencidos con stock</option><option value="PROXIMO" th:selected="${estado == 'PROXIMO'}">Por vencer (0–90 días)</option><option value="AGOTADO" th:selected="${estado == 'AGOTADO'}">Agotados</option></select></div><div><label for="tam">Filas por página</label><select id="tam" name="tam"><option th:each="n : ${ {10,20,50} }" th:value="${n}" th:text="${n}" th:selected="${tam == n}"></option></select></div><button class="btn" type="submit">Filtrar</button><a class="btn s" th:href="@{/lotes}">Limpiar</a></form><p class="vacio" th:if="${total == 0}">No se encontraron registros con estos filtros.</p><div class="wrap"><table><thead><tr><th scope="col">Insumo</th><th scope="col">Lote</th><th scope="col">Vencimiento</th><th scope="col">Cantidad</th><th scope="col">Unidad</th><th scope="col">Ubicación</th><th scope="col">Proveedor</th><th scope="col">Estado</th></tr></thead><tbody><tr th:each="f : ${filas}"><td th:text="${f.insumo}"></td><td th:text="${f.codigo_qr}"></td><td th:text="${f.fecha_vencimiento}"></td><td th:text="${f.cantidad_actual}"></td><td th:text="${f.unidad}"></td><td th:text="${f.ubicacion}"></td><td th:text="${f.proveedor}"></td><td th:text="${f.situacion}"></td></tr></tbody></table></div><nav class="paginador" aria-label="Páginas del listado"><span><strong th:text="${total}"></strong> resultados · Página <strong th:text="${pagina}"></strong> de <strong th:text="${paginas}"></strong></span><div><a class="btn s" th:if="${pagina > 1}" th:href="@{/lotes(q=${q},estado=${estado},tam=${tam},pagina=${pagina - 1})}">Anterior</a> <a class="btn s" th:if="${pagina < paginas}" th:href="@{/lotes(q=${q},estado=${estado},tam=${tam},pagina=${pagina + 1})}">Siguiente</a></div></nav></section></main></div></body></html>
