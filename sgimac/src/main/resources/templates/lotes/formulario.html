<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo lote')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('lotes')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Nuevo lote')}"></div>
<div class="card form">
    <h2>Datos del lote</h2>
    <form th:action="@{/lotes/nuevo}" method="post">
        <div class="grid">
            <div class="full">
                <label>Insumo</label>
                <select name="idInsumo" required>
                    <option th:each="i : ${insumos}" th:value="${i.idInsumo}" th:text="${i.nombre} + ' (' + ${i.codigo} + ')'"></option>
                </select>
            </div>
            <div>
                <label>Proveedor</label>
                <select name="idProveedor" required>
                    <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.razonSocial}"></option>
                </select>
            </div>
            <div>
                <label>Ubicación</label>
                <select name="idUbicacion" required>
                    <option th:each="u : ${ubicaciones}" th:value="${u.idUbicacion}" th:text="${u.nombre}"></option>
                </select>
            </div>
            <div>
                <label>Código QR / código de lote</label>
                <input type="text" name="codigoQr" placeholder="Ej.: L-2026-010" required>
            </div>
            <div>
                <label>Fecha de vencimiento</label>
                <input type="date" name="fechaVencimiento" required>
            </div>
            <div>
                <label>Cantidad</label>
                <input type="number" name="cantidadActual" min="0" required>
            </div>
        </div>
        <div class="actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn g" th:href="@{/lotes}">Cancelar</a>
        </div>
    </form>
</div>
</main>
</div>
</body>
</html>
