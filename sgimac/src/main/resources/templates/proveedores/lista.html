<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('proveedores')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Proveedores')}"></div>
<div class="card">
    <h2>Agregar proveedor</h2>
    <form th:action="@{/proveedores/nuevo}" method="post">
        <div class="grid">
            <div><label>Razón social</label><input type="text" name="razonSocial" placeholder="Razón social" required></div>
            <div><label>RUC</label><input type="text" name="ruc" placeholder="RUC (11 dígitos)" maxlength="11" required></div>
            <div><label>Teléfono</label><input type="text" name="telefono" placeholder="Teléfono"></div>
            <div><button class="btn" type="submit">Agregar</button></div>
        </div>
    </form>
</div>
<div class="card">
    <h2>Listado de proveedores</h2>
    <div class="vacio" th:if="${#lists.isEmpty(proveedores)}">No hay proveedores registrados.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(proveedores)}">
        <table>
            <tr><th>Razón social</th><th>RUC</th><th>Teléfono</th></tr>
            <tr th:each="p : ${proveedores}">
                <td th:text="${p.razonSocial}"></td>
                <td th:text="${p.ruc}"></td>
                <td th:text="${p.telefono}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
