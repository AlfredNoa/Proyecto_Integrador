<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alertas')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('alertas')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Alertas')}"></div>
<div class="card">
    <h2>Alertas pendientes (<span th:text="${#lists.size(alertas)}">0</span>)</h2>
    <div class="vacio" th:if="${#lists.isEmpty(alertas)}">No hay alertas pendientes.</div>
    <div class="al" th:each="a : ${alertas}">
        <span>
            <span class="b"
                  th:classappend="${a.tipo == 'CADUCIDAD' and a.nivel == 'ALTO'} ? 'red' : (${a.tipo == 'CADUCIDAD' and a.nivel == 'MEDIO'} ? 'org' : 'blu')"
                  th:text="${a.tipo == 'CADUCIDAD'} ? (${a.nivel == 'ALTO'} ? 'Crítico' : 'Por vencer') : 'Stock bajo'"></span>
            <span th:text="${a.nombreInsumo} + ' — lote ' + ${a.codigoQrLote} +
                            (${a.tipo == 'CADUCIDAD'} ? (' · vence ' + ${#temporals.format(a.fechaVencimientoLote, 'dd/MM/yyyy')}) : '')"></span>
        </span>
        <form th:action="@{/alertas/{id}/atender(id=${a.idAlerta})}" method="post">
            <button class="btn s" type="submit">Marcar atendida</button>
        </form>
    </div>
    <p class="nota">Las alertas críticas y de lotes vencidos se notifican al personal médico.</p>
</div>
</main>
</div>
</body>
</html>
