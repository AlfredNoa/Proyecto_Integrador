<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimientos')}"></head>
<body>
<div class="app">
<nav th:replace="~{fragments/layout :: sidebar('movimientos')}"></nav>
<main class="main">
<div th:replace="~{fragments/layout :: topbar('Movimientos')}"></div>
<div class="card">
    <h2>Registrar movimiento</h2>
    <form th:action="@{/movimientos/registrar}" method="post">
        <div class="grid">
            <div>
                <label>Lote</label>
                <select name="idLote" required>
                    <option th:each="l : ${lotes}" th:value="${l.idLote}"
                            th:text="${l.codigoQr} + ' · ' + ${l.nombreInsumo} + ' · stock ' + ${l.cantidadActual}"></option>
                </select>
            </div>
            <div>
                <label>Tipo</label>
                <select name="tipo" required>
                    <option value="SALIDA">Salida</option>
                    <option value="ENTRADA">Entrada</option>
                </select>
            </div>
            <div>
                <label>Cantidad</label>
                <input type="number" name="cantidad" min="1" value="1" required>
            </div>
            <div>
                <button class="btn" type="submit">Registrar</button>
            </div>
        </div>
    </form>
    <div class="msg err" th:if="${error}" th:text="${error}"></div>
    <div class="msg ok" th:if="${mensaje}" th:text="${mensaje}"></div>
</div>

<div class="card">
    <h2>Historial de movimientos</h2>
    <div class="vacio" th:if="${#lists.isEmpty(movimientos)}">Aún no hay movimientos.</div>
    <div class="wrap" th:unless="${#lists.isEmpty(movimientos)}">
        <table>
            <tr><th>Fecha</th><th>Tipo</th><th>Insumo</th><th>Lote</th><th>Cantidad</th><th>Usuario</th></tr>
            <tr th:each="m : ${movimientos}">
                <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td><span class="b" th:classappend="${m.tipo == 'SALIDA'} ? 'org' : 'grn'" th:text="${m.tipo}"></span></td>
                <td th:text="${m.nombreInsumo}"></td>
                <td th:text="${m.codigoQrLote}"></td>
                <td th:text="${m.cantidad}"></td>
                <td th:text="${m.nombreUsuario}"></td>
            </tr>
        </table>
    </div>
</div>
</main>
</div>
</body>
</html>
